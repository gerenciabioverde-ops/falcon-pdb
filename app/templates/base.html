<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Falcon PDB{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  {% if usuario %}
  <header class="bg-slate-900 text-white">
    <div class="max-w-[96rem] mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold">Falcon PDB <span class="text-slate-400 font-normal">· PDB Exportadores</span></a>
      <form method="post" action="/logout"><button class="text-sm text-slate-300 hover:text-white">Salir ({{ usuario.username }})</button></form>
    </div>
  </header>
  {% endif %}
  <main class="max-w-[96rem] mx-auto px-4 py-6">{% block contenido %}{% endblock %}</main>
</body>
</html>
